<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sobrantes del taller</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23161616'/%3E%3Crect x='5' y='13' width='22' height='12' fill='%230f62fe'/%3E%3Crect x='5' y='7' width='13' height='4' fill='%2378a9ff'/%3E%3C/svg%3E">
<style>
  :root { --fondo: #ffffff; --texto: #161616; --texto-2: #525252; --acento: #0f62fe; --shell: #161616; --shell-texto: #f4f4f4; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fondo: #161616; --texto: #f4f4f4; --texto-2: #c6c6c6; --acento: #78a9ff; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --fondo: #161616; --texto: #f4f4f4; --texto-2: #c6c6c6; --acento: #78a9ff; color-scheme: dark; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 0.875rem/1.43 "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.16px; }
  header { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); background: var(--shell); color: var(--shell-texto); }
  header b { font-weight: 600; }
  header span { padding-left: 12px; border-left: 1px solid #393939; }
  main { max-width: 40rem; padding: 48px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
  h1 { margin: 0 0 12px; font-size: 1.75rem; font-weight: 300; }
  p { margin: 0 0 24px; color: var(--texto-2); }
  a { display: inline-flex; align-items: center; height: 40px; padding: 0 16px; background: #0f62fe; color: #ffffff; text-decoration: none; }
  a:hover { background: #0050e6; }
  a:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
</style>
<script>
  try {
    var tema = localStorage.getItem("sobrantes-tema");
    if (tema === "light" || tema === "dark") document.documentElement.setAttribute("data-theme", tema);
  } catch (e) {}
</script>
</head>
<body>
<header><b>Tool Design</b><span>Sobrantes</span></header>
<main>
  <h1>Esta dirección no existe</h1>
  <p>La lista de recortes está en la página principal.</p>
  <a id="volver" href="./">Ver los recortes</a>
</main>
<script>
  // La página está en la primera carpeta de la dirección (la del repositorio, en GitHub Pages).
  var carpeta = location.pathname.split("/").filter(Boolean)[0];
  if (carpeta) document.getElementById("volver").setAttribute("href", "/" + carpeta + "/");
</script>
</body>
</html>
